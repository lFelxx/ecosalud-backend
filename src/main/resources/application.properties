# ═══════════════════════════════════════════════════════════════════════════
# Ecosalud Backend — Configuración de la aplicación
# ═══════════════════════════════════════════════════════════════════════════
# Las variables de entorno se leen del sistema. Para desarrollo local
# crea un archivo .env o configúralas en tu IDE (Run Configurations).
# En producción (Render, Railway, etc.) defínelas en el dashboard.
# ═══════════════════════════════════════════════════════════════════════════

# ── Base de datos PostgreSQL ─────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecosalud}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──────────────────────────────────────────────────────
# update: aplica cambios sin borrar datos. Usar 'validate' en producción.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Servidor ─────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── CORS — orígenes permitidos ───────────────────────────────────────────
# En producción define FRONTEND_URL con la URL de Vercel, ej:
# FRONTEND_URL=https://ecosalud-frontend.vercel.app
frontend.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# ── Logging ──────────────────────────────────────────────────────────────
logging.level.com.ecosalud=INFO
logging.level.org.springframework.security=WARN
