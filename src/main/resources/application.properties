# Ecosalud Backend — Configuracion
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecosalud}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:161118}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
server.port=${PORT:8080}
frontend.allowed-origins=${FRONTEND_URL:http://localhost:5173}
jwt.secret=${JWT_SECRET:ZWNvc2FsdWQtc2VjcmV0LWtleS1zdXBlci1zZWd1cmEtMjAyNC1hY2FkZW1pY28=}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Nombre comercial de la plataforma (actualizado de "Ecosalud Market" a "Ecosalud")
platform.name=Ecosalud
# Dominio de la plataforma para generar subdominios de tenants
platform.domain=ecosalud.com
# Dominio del panel de administración de la plataforma
platform.admin-domain=ecosaludmarket.com
platform.admin-email=superadmin@ecosaludmarket.com
# Configuración de email transaccional (Resend)
# Obtener API key en: https://resend.com/api-keys
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:noreply@ecosalud.com}
resend.from-name=${RESEND_FROM_NAME:Ecosalud}
logging.level.com.ecosalud=INFO
logging.level.org.springframework.security=WARN