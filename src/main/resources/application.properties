# Ecosalud Backend — Configuracion
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecosalud}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:161118}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
server.port=${PORT:8080}
frontend.allowed-origins=${FRONTEND_URL:http://localhost:5173}
jwt.secret=${JWT_SECRET:ZWNvc2FsdWQtc2VjcmV0LWtleS1zdXBlci1zZWd1cmEtMjAyNC1hY2FkZW1pY28=}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Nombre comercial de la plataforma (actualizado de "Ecosalud Market" a "Ecosalud")
platform.name=Ecosalud
# Dominio de la plataforma para generar subdominios de tenants
platform.domain=ecosalud.com
# Dominio del panel de administración de la plataforma
platform.admin-domain=ecosaludmarket.com
platform.admin-email=superadmin@ecosaludmarket.com
# Configuración de email transaccional (Resend)
# Obtener API key en: https://resend.com/api-keys
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:noreply@ecosalud.com}
resend.from-name=${RESEND_FROM_NAME:Ecosalud}
logging.level.com.ecosalud=INFO
logging.level.org.springframework.security=WARN
# ── Media / File Upload ──────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Directorio raíz de uploads (solo usado en modo disco local / desarrollo)
media.upload-dir=${UPLOAD_DIR:uploads}
#
# ── Cloudinary (almacenamiento persistente en nube) ───────────────────────────
# Cuando CLOUDINARY_URL está configurado, el sistema usa Cloudinary automáticamente
# en lugar de disco local. Obtener credenciales en: https://cloudinary.com
# Formato: cloudinary://api_key:api_secret@cloud_name
# Ejemplo: CLOUDINARY_URL=cloudinary://123456789012345:abcdefghijklmnopqrstuvwxyz@mi-cloud
#
# En desarrollo (sin esta variable) → se usa disco local (uploads/)
# En producción (Railway/Render)    → configurar CLOUDINARY_URL como variable de entorno
#
# CLOUDINARY_URL=  (dejar vacío en desarrollo, configurar en producción)
#
# ── PayU Colombia — pasarela de pago ─────────────────────────────────────────
# Credenciales de sandbox para pruebas (públicas en documentación oficial PayU):
payu.merchant-id=${PAYU_MERCHANT_ID:508029}
payu.account-id=${PAYU_ACCOUNT_ID:512321}
payu.api-key=${PAYU_API_KEY:4Vj8eK4rloUd272L48hsrarnUA}
# true = sandbox (pruebas), false = producción
payu.sandbox=${PAYU_SANDBOX:true}
# URL pública del webhook donde PayU envía las confirmaciones (HTTPS obligatorio en prod)
payu.confirmation-url=${PAYU_CONFIRMATION_URL:http://localhost:8080/api/billing/payu/confirmation}
# URL del frontend donde PayU redirige al usuario después del pago
payu.response-url=${PAYU_RESPONSE_URL:http://localhost:5173/billing/result}
#
# Documentación PayU:
#   Webcheckout: https://developers.payulatam.com/latam/es/docs/integrations/webcheckout-integration.html
#   Confirmación: https://developers.payulatam.com/latam/es/docs/integrations/webcheckout-integration/payment-confirmation-page.html
#   Tarjetas de prueba: https://developers.payulatam.com/latam/es/docs/getting-started/test-your-solution.html

# ── Twilio — SMS y WhatsApp ───────────────────────────────────────────────────
# Obtener credenciales en: https://console.twilio.com
# Formato número: +57XXXXXXXXXX (Colombia) / +1XXXXXXXXXX (EEUU Twilio sandbox)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}
# WhatsApp Sandbox Twilio: whatsapp:+14155238886
# WhatsApp Business oficial (requiere aprobación Meta): whatsapp:+57XXXXXXXXXX
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}

# ── Recordatorios automáticos de cita ────────────────────────────────────────
# Job diario que envía email + SMS/WhatsApp a pacientes con cita al día siguiente
# Cron: Segundos Minutos Horas DíaMes Mes DíaSemana
# Default: todos los días a las 9:00 AM
ecosalud.reminder.cron=${REMINDER_CRON:0 0 9 * * *}

# ── HL7 FHIR R4 — Interoperabilidad SISPRO (Res. 2654/2019) ─────────────────
# URL base del servidor FHIR expuesta en el CapabilityStatement y en los fullUrl de los Bundle
# En producción: https://api.tu-clinica.ecosalud.com/api/fhir
app.fhir.base-url=${FHIR_BASE_URL:http://localhost:8080/api/fhir}
# Versión de la plataforma (aparece en CapabilityStatement.software.version)
app.version=${APP_VERSION:1.0.0}

# ── Trial — período de prueba gratuito ───────────────────────────────────────
# Duración del trial en días (default: 14)
ecosalud.trial.duration-days=${TRIAL_DURATION_DAYS:14}
# Cron de expiración: corre todos los días a las 02:00 AM
ecosalud.trial.expiry-cron=${TRIAL_EXPIRY_CRON:0 0 2 * * *}
# Cron de aviso previo: corre todos los días a las 09:00 AM
ecosalud.trial.warning-cron=${TRIAL_WARNING_CRON:0 0 9 * * *}